name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kobo
          POSTGRES_PASSWORD: kobo
          POSTGRES_DB: kobo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kobo -d kobo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A throwaway database that exists only inside this job, not a secret.
      KOBO_TEST_DATABASE_URL: postgres://kobo:kobo@127.0.0.1:5432/kobo_test?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      # The e2e tests skip themselves when the database URL is missing, and a
      # skip still passes. Fail on any skip so they cannot silently stop running.
      - name: go test ./...
        shell: bash
        run: |
          go test -v ./... | tee "$RUNNER_TEMP/go-test.log"
          if grep -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then
            echo "::error::tests were skipped"
            exit 1
          fi

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
